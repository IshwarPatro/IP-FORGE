name: Alpha package verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python scripts/release_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  flutter-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python scripts/release_flutter_acceptance.py --flutter "$(command -v flutter)" --output acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-acceptance
          path: acceptance.json
