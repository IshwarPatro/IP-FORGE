# Copy to your Flutter project's .github/workflows/flutter-review.yml.
# Replace REVIEWED_COMMIT with the published IP-FORGE commit before enabling.
name: Flutter review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: python -m pip install 'git+https://github.com/IshwarPatro/IP-FORGE.git@REVIEWED_COMMIT'
      - run: flutter pub get
      - run: ip-forge check . --json > forge-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-report
          path: forge-report.json
