# ==============================================================================
# IP FORGE: Docker Compose Configuration for AMD ROCm vLLM Serving
# Enables high-throughput reasoning on AMD Instinct (MI250 / MI300X) or Radeon Pro.
# ==============================================================================

version: "3.8"

services:
  vllm-rocm:
    image: rocm/vllm:latest
    container_name: ip-forge-vllm-rocm
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    network_mode: host
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    security_opt:
      - "seccomp=unconfined"
    group_add:
      - "video"
      - "render"
    environment:
      - HIP_VISIBLE_DEVICES=0
      - VLLM_ROCM_PAGED_ATTN=1
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./launch_vllm_rocm.sh:/app/launch_vllm_rocm.sh:ro
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model meta-llama/Meta-Llama-3-70B-Instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --dtype bfloat16
      --max-model-len 8192
      --gpu-memory-utilization 0.92
      --trust-remote-code
